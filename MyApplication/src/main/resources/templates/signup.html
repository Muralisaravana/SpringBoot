<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>

<h2>Create Account</h2>

<!-- Show error message if email already exists or any error -->
<div th:if="${error}" style="color: red; margin-bottom: 10px;">
    <p th:text="${error}"></p>
</div>

<!-- Signup Form -->
<form th:action="@{/signup}" th:object="${user}" method="post">

    <label>Full Name:</label><br>
    <input type="text" th:field="*{fullName}" required><br><br>

    <label>Email:</label><br>
    <input type="email" th:field="*{email}" required><br><br>

    <label>Password:</label><br>
    <input type="password" th:field="*{password}" required><br><br>

    <button type="submit">Register</button>
</form>

<br>
<p>Already have an account? <a th:href="@{/signin}">Sign In</a></p>

</body>
</html>
